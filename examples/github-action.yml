# Copy into .github/workflows/brand-leak-guard.yml and edit the build command,
# scan directory, self domain, and forbidden terms file for your site.
name: brand-leak-guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: |
          node ./brand-leak-guard.mjs ./dist \
            --self clientsite.com \
            --terms-file ./forbidden.txt
